version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: eventmarketplace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: EventMarketplaceDb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: EventMarketplace.API/Dockerfile
    container_name: eventmarketplace-api
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: server=mysql;port=3306;user=root;password=rootpassword;database=EventMarketplaceDb;
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: EventMarketplace.Api
      Jwt__Audience: EventMarketplace.Client
      Jwt__AccessTokenExpirationMinutes: 60
      Jwt__RefreshTokenExpirationDays: 7
    ports:
      - "8080:8080"

volumes:
  mysql_data:
